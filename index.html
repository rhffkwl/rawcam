<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보이는대로">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>보이는 대로 카메라</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="flash"></div>
</main>

<header id="top">
  <button id="btnRes" class="chip" aria-label="해상도 선택">4:3 최대</button>
  <span id="resLabel" class="chip ghost">—</span>
  <button id="btnMirror" class="chip on" hidden aria-label="전면 좌우반전 저장">반전 저장 켬</button>
</header>

<footer id="bottom">
  <button id="thumb" aria-label="마지막 사진"><img id="thumbImg" alt=""></button>
  <button id="shutter" aria-label="촬영"><span></span></button>
  <button id="btnFlip" aria-label="카메라 전환">⟲</button>
</footer>

<section id="review" hidden>
  <div id="reviewImgWrap"><img id="reviewImg" alt="찍은 사진"></div>
  <p class="muted" id="reviewInfo"></p>
  <p class="muted small">저장 버튼 → "이미지 저장"을 누르면 사진 앱에 들어가요. 안 되면 사진을 길게 눌러 저장하세요.</p>
  <div class="review-btns">
    <button id="btnCloseReview">닫기</button>
    <button id="btnSave" class="primary">저장</button>
  </div>
</section>

<section id="startScreen">
  <h1>보이는 대로 카메라</h1>
  <p>미리보기 화면 그대로 저장해요.<br>스마트 HDR·야간 모드·얼굴 보정 없음.</p>
  <button id="btnStart" class="primary">카메라 켜기</button>
  <p id="startMsg" class="muted"></p>
</section>

<div id="toast" hidden></div>
<script src="app.js?v=3"></script>
</body>
</html>
